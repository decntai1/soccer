# .github/workflows/soccer.yml
# Scheduled runs (05:23 and 23:41 UTC): football-data download, ingest (API-Football free plan: D-1/D/D+1 only, so a
#                   day that is missed is gone; two runs a day so one failure loses nothing), re-price boards dated
#                   today or later, build paper slips, grade every past board day with open rows, report.
# Push of boards:   price every board folder dated today or later and build the paper slips.
# Manual "backtest": download the football-data.co.uk CSVs and run bandit 1 on every past season.
#
# Repo layout:
#   soccer_ingest.py soccer_model.py soccer_system.py soccer_bandit.py soccer_selftest.py soccer_fake.py
#   boards/soccer/<date>/*.net.json     <date> = the UTC date of the kick-offs
#   data/        ingest tables (committed)        ledger/soccer.sqlite (committed)        results/ (committed)
# Secrets: APIFOOTBALL_KEY (required), PROLYT_API_KEY (optional).
name: soccer

on:
  schedule:
    - cron: "23 5 * * *"               # 05:23 UTC: every game of the day before is over and its statistics have settled
    - cron: "41 23 * * *"              # 23:41 UTC: today's games, while today is still inside the free plan's window
  push:
    paths: ["boards/soccer/**"]
  workflow_dispatch:
    inputs:
      job:
        description: "daily | backtest | lineups"
        default: daily
      date:
        description: "date to grade or to fetch lineups for (YYYY-MM-DD); empty = yesterday / today, UTC"
        required: false
      seasons:
        description: "backtest seasons, e.g. 2015-2025"
        default: "2015-2025"

permissions:
  contents: write

concurrency:                           # two runs must never commit the ledger at the same time
  group: soccer-ledger
  cancel-in-progress: false

env:
  SOCCER_CACHE: cache
  SOCCER_OUT: data
  SOCCER_DB: ledger/soccer.sqlite
  SOCCER_FD: fd

jobs:
  soccer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy duckdb tabulate
      - run: mkdir -p ledger results data && python soccer_system.py selftest | tail -1

      # ---------------- backtest (manual): no API calls, football-data.co.uk only
      - name: Bandit 1 on past seasons
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'backtest'
        run: |
          python soccer_bandit.py simulate | tail -4
          first="${{ github.event.inputs.seasons }}"; first="${first%%-*}"; last="${{ github.event.inputs.seasons }}"; last="${last##*-}"
          python soccer_bandit.py download --seasons "$((first - 3))-$last"
          python soccer_bandit.py backtest --seasons "${{ github.event.inputs.seasons }}" --out results

      # ---------------- everything else needs the API cache
      - uses: actions/cache/restore@v4
        if: github.event.inputs.job != 'backtest'
        with:
          path: |
            cache
            fd
          key: soccer-cache-${{ github.run_id }}
          restore-keys: soccer-cache-

      - name: football-data.co.uk (model history; free, no API requests)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'daily'
        run: |
          y=$(date -u +%Y); m=$(date -u +%-m); [ "$m" -lt 7 ] && y=$((y - 1))
          python soccer_bandit.py download --seasons "$((y - 2))-$y" | tail -3

      - name: Ingest
        id: ingest
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily')
        continue-on-error: true        # a failed ProLyt upload must not stop the grading; the CSVs are already written
        run: python soccer_ingest.py run
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          PROLYT_API_KEY: ${{ secrets.PROLYT_API_KEY }}

      - name: Pre-match lineups
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'lineups'
        run: python soccer_ingest.py lineups --date "${DATE:-$(date -u +%F)}"
        env:
          DATE: ${{ github.event.inputs.date }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}

      - uses: actions/cache/save@v4    # saved even when a later step fails: on the free plan a lost cache cannot be re-fetched
        if: always() && github.event.inputs.job != 'backtest'
        with:
          path: |
            cache
            fd
          key: soccer-cache-${{ github.run_id }}

      - name: Price boards and build paper slips
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.job == 'daily'
        run: |
          today=$(date -u +%F)
          for dir in boards/soccer/*/; do
            d=$(basename "$dir")
            [[ "$d" < "$today" ]] && continue          # never re-price a day that has been played
            python soccer_system.py price --date "$d" --boards "$dir" | tee "results/price-$d.txt"
            python soccer_system.py slips --date "$d" --targets 3 6 9 --legs 7 | tee "results/slips-$d.txt"
          done

      - name: Grade and report
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily')
        run: |
          today=$(date -u +%F)
          for dir in boards/soccer/*/; do
            [ -d "$dir" ] || continue
            d=$(basename "$dir")
            [ -n "$DATE" ] && [ "$d" != "$DATE" ] && continue
            [[ "$d" < "$today" ]] || continue              # a day is graded once it is over; open rows get another try each run
            python soccer_system.py grade --date "$d" --boards "$dir" | tee "results/grade-$d.txt"
          done
          python soccer_system.py report > /dev/null && cp ledger/soccer_report.md results/soccer_report.md || true
        env:
          DATE: ${{ github.event.inputs.date }}

      - name: Commit tables, ledger and results
        if: always()
        run: |
          git config user.name "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          git add -A data ledger results 2>/dev/null || true
          git diff --cached --quiet || git commit -m "soccer: $(date -u +%F) ${{ github.event_name }}"
          git pull --rebase --autostash && git push

      - name: Fail the run if the ingest failed
        if: steps.ingest.outcome == 'failure'
        run: exit 1
